[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qram-qiskit-learning"
version = "1.0.0"
description = "Educational gate-based QRAM lookup oracles and a search-routing example in Qiskit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pytest>=8,<10",
  "qiskit~=2.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

